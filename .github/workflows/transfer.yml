name: Mail.ru → Yandex.Disk

on:
  workflow_dispatch:
    inputs:
      mailru_url:
        description: 'Ссылка Mail.ru (https://cloud.mail.ru/public/...)'
        required: true
      dest_folder:
        description: 'Папка на Яндекс.Диске (оставь пустым — создастся автоматически)'
        required: false
        default: ''

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # до 6 часов

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install requests

      - name: Run transfer
        env:
          YA_LOGIN:         ${{ secrets.YA_LOGIN }}
          YA_APP_PASSWORD:  ${{ secrets.YA_APP_PASSWORD }}
          MAILRU_PUBLIC_URL: ${{ inputs.mailru_url }}
          YA_DEST_FOLDER:   ${{ inputs.dest_folder }}
        run: python mailru_to_yandex.py
